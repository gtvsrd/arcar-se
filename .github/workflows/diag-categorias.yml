name: Diagnostico (temporario)
on:
  push:
    branches: [diag-categorias]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0 Chrome/130" -w "\nHTTP %{http_code}\n" "https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&family=Fraunces:opsz,wght@9..144,600&family=DM+Sans:wght@500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400;1,7..72,700&display=swap" | grep -E "font-family|font-style|font-weight|HTTP|rror" | sort | uniq -c
