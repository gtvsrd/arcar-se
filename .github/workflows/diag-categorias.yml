name: Diagnostico (temporario)
on:
  push:
    branches: [diag-categorias]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in A AAAA CAA TXT NS; do echo "== arcar.se $t (Google DNS):"; dig +short @8.8.8.8 arcar.se $t; done
          echo "== www.arcar.se:"; dig +short @8.8.8.8 www.arcar.se
          echo "== _github-pages-challenge-gtvsrd.arcar.se TXT:"; dig +short @8.8.8.8 _github-pages-challenge-gtvsrd.arcar.se TXT
          echo "== Cloudflare DNS A:"; dig +short @1.1.1.1 arcar.se A
          echo "== HTTP:"; curl -sI -m 15 http://arcar.se | head -5
          echo "== HTTPS:"; curl -sI -m 15 https://arcar.se 2>&1 | head -3; curl -s -m 15 -o /dev/null -w "%{http_code} %{ssl_verify_result}\n" https://arcar.se 2>&1
          echo "== certificado:"; echo | openssl s_client -connect arcar.se:443 -servername arcar.se 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1 | head
          for d in arcarse.com arcarse.org arcarse.online; do echo "== $d A:"; dig +short @8.8.8.8 $d A; echo "   http:"; curl -sI -m 15 http://$d | grep -iE "^HTTP|^location"; echo "   https:"; curl -sI -m 15 https://$d 2>&1 | grep -iE "^HTTP|^location|curl:"; done
