name: Diagnostico (temporario)
on:
  push:
    branches: [diag-categorias]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fontes
          css=$(curl -s -A "Mozilla/5.0 Chrome/130" "https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&display=swap")
          echo "$css" > fontes/literata.css
          i=0; for u in $(echo "$css" | grep -o "https://fonts.gstatic.com/[^)]*"); do i=$((i+1)); curl -s -o fontes/f$i.woff2 "$u"; done
          ls -la fontes
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add fontes && git commit -m "fontes para previa" && git push
