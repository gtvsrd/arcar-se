name: Diagnostico (temporario)
on:
  push:
    branches: [diag-categorias]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          U=$(grep -o "https://[a-z0-9]*\.supabase\.co" js/config.js); K=$(node -e "const s=require('fs').readFileSync('js/config.js','utf8');console.log(s.match(/SUPABASE_ANON_KEY\s*=\s*['\"]([^'\"]+)/)[1])")
          echo "R1 post_likes: $(curl -s -w ' HTTP %{http_code}' "$U/rest/v1/post_likes?select=*" -H "apikey: $K")"
          echo "R2 post_views: $(curl -s -o /dev/null -w 'HTTP %{http_code}' "$U/rest/v1/post_views?select=*&limit=1" -H "apikey: $K")"
          echo "R3 like_post: $(curl -s -w ' HTTP %{http_code}' -X POST "$U/rest/v1/rpc/like_post" -H "apikey: $K" -H 'Content-Type: application/json' -d '{"p_slug":"__teste__","p_like":true}')"
          B=https://gtvsrd.github.io/arcar-se
          echo "R4 index tem post-actions.js: $(curl -s $B/ | grep -o 'js/post-actions.js[^"]*')"
          echo "R5 css tem pa-like: $(curl -s $B/css/components.css | grep -c 'pa-like')"
          echo "R6 js: $(curl -s $B/js/post-actions.js | grep -c 'initPostActions')"
