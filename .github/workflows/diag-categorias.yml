name: Diagnostico (temporario)
on:
  push:
    branches: [diag-categorias]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/si && cd /tmp/si && npm pack simple-icons@13.21.0 --silent && tar -xzf simple-icons-*.tgz
          ls package/icons/whatsapp.svg && head -c 300 package/LICENSE.md; echo; grep -o '"version": "[^"]*"\|"license": "[^"]*"' package/package.json
          cd $GITHUB_WORKSPACE && mkdir -p icone && cp /tmp/si/package/icons/whatsapp.svg icone/ && cp /tmp/si/package/LICENSE.md icone/LICENSE-simple-icons.md
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add icone && git commit -m "icone whatsapp (simple-icons, CC0)" && git push
