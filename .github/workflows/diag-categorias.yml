name: Diagnostico (temporario)
on:
  push:
    branches: [diag-categorias]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 30
          P=$(curl -s https://arcar.se/post/manifest.json | python3 -c "import sys,json;print(json.load(sys.stdin)['slugs'][0])")
          echo "R1 artigo: $P"
          curl -s https://arcar.se/post/$P/ > /tmp/p.html
          echo "R2 $(grep -o '<link rel="canonical" href="[^"]*"' /tmp/p.html)"
          echo "R3 $(grep -o '<meta property="og:image" content="[^"]*"' /tmp/p.html)"
          img=$(grep -o '<meta property="og:image" content="[^"]*"' /tmp/p.html | sed 's/.*content="//; s/"$//')
          echo "R4 imagem: $(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$img")"
          echo "R5 sitemap: $(curl -s https://arcar.se/sitemap.xml | grep -o '<loc>[^<]*</loc>' | head -2 | tr '\n' ' ')"
          echo "R6 antigo: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://gtvsrd.github.io/arcar-se/post/$P/)"
          echo "R7 www: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://www.arcar.se/)"
          echo "R8 http: $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' http://arcar.se/)"
          for d in arcarse.com arcarse.org arcarse.online; do echo "R9 $d: http $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' http://$d/) | https $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://$d/ 2>&1)"; done
